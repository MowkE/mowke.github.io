  <p class="lbl k">03 · software</p>
  <h1>samaOS</h1>
  <p>A tiny computer I wrote for this page. Pick a program from the dock or type into the terminal. Everything on the screen is really running, and the numbers underneath are counted live.</p>
</div>

<div class="os" id="os">
  <section class="win os-term" aria-label="Terminal">
    <div class="bar"><i></i><i></i><i></i><span>terminal</span></div>
    <div class="os-out" aria-live="polite"></div>
    <label class="prompt"><span>sama@os ~ %</span><input type="text" spellcheck="false" autocomplete="off" aria-label="Command" placeholder="help" /></label>
  </section>
  <section class="win" aria-label="Screen">
    <div class="bar"><i></i><i></i><i></i><span class="os-title">screen</span></div>
    <div class="screen"><canvas></canvas></div>
    <div class="os-foot"><div class="os-stats"></div><div class="os-controls"></div></div>
  </section>
</div>

<nav class="dock" aria-label="Programs">
  <button data-c="sort"><b>▁▃▇</b>sort</button>
  <button data-c="maze"><b>⌗</b>maze</button>
  <button data-c="life"><b>▚</b>life</button>

</nav>
